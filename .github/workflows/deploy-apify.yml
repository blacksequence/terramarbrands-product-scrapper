name: Deploy to Apify

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    build-test-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test
            - name: Push Actor to Apify
              env:
                  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
              run: |
                  npx -y apify-cli@latest login --token "$APIFY_TOKEN" -m manual
                  npx -y apify-cli@latest push
